<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title"><title id="title">Engineering stack by domain</title><rect width="1200" height="610" rx="22" fill="#0d1117" stroke="#30363d"/><text x="52" y="58" fill="#f0f6fc" font-family="Arial" font-size="26" font-weight="700">ENGINEERING STACK</text><text x="52" y="88" fill="#8b949e" font-family="monospace" font-size="15">TOOLS GROUPED BY THE SYSTEMS THEY SUPPORT</text><g font-family="Arial"><g transform="translate(52 125)"><text fill="#58a6ff" font-size="20" font-weight="700">LANGUAGES</text><text y="38" fill="#c9d1d9" font-size="18">TypeScript · Python · Solidity · SQL</text></g><g transform="translate(52 215)"><text fill="#3fb950" font-size="20" font-weight="700">PRODUCT ENGINEERING</text><text y="38" fill="#c9d1d9" font-size="18">Next.js · React · Tauri · Tailwind CSS</text></g><g transform="translate(52 305)"><text fill="#d2a8ff" font-size="20" font-weight="700">WEB3 / DEFI</text><text y="38" fill="#c9d1d9" font-size="18">Ethereum · EVM · Solana · Cosmos · Foundry · Wagmi · Viem</text></g><g transform="translate(52 395)"><text fill="#f2cc60" font-size="20" font-weight="700">AI SYSTEMS</text><text y="38" fill="#c9d1d9" font-size="18">PyTorch · Local LLM · Agents · MCP · RAG · Embeddings</text></g><g transform="translate(52 485)"><text fill="#ffa657" font-size="20" font-weight="700">INFRA / DATA</text><text y="38" fill="#c9d1d9" font-size="18">Docker · K3s · Linux · PostgreSQL</text></g></g><rect x="48" y="550" width="1104" height="1" fill="#30363d"/><text x="52" y="582" fill="#8b949e" font-family="monospace" font-size="14">The point is not an icon wall — it is a map from tools to engineering capability.</text></svg>
